<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ask My Docs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px 40px;
      border-bottom: 1px solid #1e2333;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .logo {
      font-size: 22px;
      font-weight: 700;
      color: #7c6af7;
    }

    header .logo span { color: #e2e8f0; }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 0;
    }

    /* Sidebar */
    .sidebar {
      background: #13161f;
      border-right: 1px solid #1e2333;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .sidebar h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 4px;
    }

    .drop-zone {
      border: 2px dashed #2d3550;
      border-radius: 12px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #7c6af7;
      background: #1a1d2e;
    }

    .drop-zone .icon { font-size: 32px; margin-bottom: 8px; }

    .drop-zone p {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }

    .drop-zone p strong { color: #a5b4fc; }

    #file-input { display: none; }

    .upload-btn {
      width: 100%;
      padding: 10px;
      background: #7c6af7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .upload-btn:hover { background: #6b58e6; }
    .upload-btn:disabled { background: #3b3f5c; cursor: not-allowed; }

    .doc-list { display: flex; flex-direction: column; gap: 8px; }

    .doc-item {
      background: #1a1d2e;
      border: 1px solid #2d3550;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .doc-item .doc-icon { color: #7c6af7; }
    .doc-item .doc-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-item .doc-chunks { font-size: 11px; color: #64748b; }

    .toast {
      background: #1a2740;
      border: 1px solid #2d4a7a;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #93c5fd;
      display: none;
    }

    .toast.error {
      background: #2d1515;
      border-color: #7a2d2d;
      color: #fca5a5;
    }

    .toast.show { display: block; }

    /* Chat area */
    .chat-area {
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #374151;
      text-align: center;
    }

    .empty-state .big-icon { font-size: 56px; }
    .empty-state h3 { font-size: 20px; color: #4b5563; }
    .empty-state p { font-size: 14px; max-width: 320px; line-height: 1.6; }

    .message { display: flex; gap: 14px; max-width: 860px; width: 100%; }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .message.user .avatar { background: #7c6af7; }
    .message.assistant .avatar { background: #1e2333; border: 1px solid #2d3550; }

    .bubble {
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.7;
      max-width: calc(100% - 50px);
    }

    .message.user .bubble {
      background: #7c6af7;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .bubble {
      background: #1a1d2e;
      border: 1px solid #2d3550;
      border-bottom-left-radius: 4px;
    }

    .bubble p { margin-bottom: 8px; }
    .bubble p:last-child { margin-bottom: 0; }

    .thinking {
      display: flex;
      gap: 5px;
      padding: 6px 0;
    }

    .thinking span {
      width: 8px;
      height: 8px;
      background: #64748b;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .thinking span:nth-child(2) { animation-delay: 0.2s; }
    .thinking span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
    }

    /* Input bar */
    .input-bar {
      padding: 20px 40px 28px;
      border-top: 1px solid #1e2333;
      background: #0f1117;
    }

    .input-wrap {
      display: flex;
      gap: 10px;
      background: #13161f;
      border: 1px solid #2d3550;
      border-radius: 12px;
      padding: 10px 14px;
      transition: border-color 0.2s;
    }

    .input-wrap:focus-within { border-color: #7c6af7; }

    #question-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e2e8f0;
      font-size: 15px;
      resize: none;
      height: 24px;
      max-height: 120px;
      font-family: inherit;
      line-height: 1.5;
    }

    #question-input::placeholder { color: #3b4268; }

    #send-btn {
      background: #7c6af7;
      border: none;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
      align-self: flex-end;
    }

    #send-btn:hover { background: #6b58e6; }
    #send-btn:disabled { background: #2d3550; cursor: not-allowed; }

    #send-btn svg { width: 16px; height: 16px; fill: white; }
  </style>
</head>
<body>

<header>
  <div class="logo">Ask<span>MyDocs</span></div>
</header>

<main>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div>
      <h2>Upload Documents</h2>
    </div>

    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <div class="icon">📄</div>
      <p><strong>Click to upload</strong> or drag & drop<br/>PDF files only</p>
      <input type="file" id="file-input" accept=".pdf" multiple />
    </div>

    <button class="upload-btn" id="upload-btn" disabled>Upload Selected File</button>

    <div id="toast" class="toast"></div>

    <div>
      <h2>Indexed Documents</h2>
      <div class="doc-list" id="doc-list"></div>
    </div>
  </aside>

  <!-- Chat -->
  <section class="chat-area">
    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <div class="big-icon">🔍</div>
        <h3>Ask your documents anything</h3>
        <p>Upload a PDF on the left, then ask questions and get answers with citations.</p>
      </div>
    </div>

    <div class="input-bar">
      <div class="input-wrap">
        <textarea id="question-input" placeholder="Ask a question about your documents..." rows="1"></textarea>
        <button id="send-btn" title="Send">
          <svg viewBox="0 0 24 24"><path d="M2 21L23 12 2 3v7l15 2-15 2v7z"/></svg>
        </button>
      </div>
    </div>
  </section>
</main>

<script>
  const API = '';

  // ─── Upload ───────────────────────────────────────────────
  let selectedFile = null;
  const fileInput = document.getElementById('file-input');
  const uploadBtn = document.getElementById('upload-btn');
  const dropZone = document.getElementById('drop-zone');
  const toast = document.getElementById('toast');
  const docList = document.getElementById('doc-list');

  fileInput.addEventListener('change', () => {
    selectedFile = fileInput.files[0] || null;
    if (selectedFile) {
      uploadBtn.disabled = false;
      uploadBtn.textContent = `Upload "${selectedFile.name}"`;
    }
  });

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type === 'application/pdf') {
      selectedFile = file;
      uploadBtn.disabled = false;
      uploadBtn.textContent = `Upload "${file.name}"`;
    } else {
      showToast('Only PDF files are supported.', true);
    }
  });

  uploadBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    uploadBtn.disabled = true;
    uploadBtn.textContent = 'Uploading...';

    const form = new FormData();
    form.append('file', selectedFile);

    try {
      const res = await fetch(`${API}/upload`, { method: 'POST', body: form });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      showToast(`✓ "${data.file}" indexed (${data.chunks_created} chunks)`);
      addDocItem(data.file, data.chunks_created);
    } catch (err) {
      showToast(`Upload failed: ${err.message}`, true);
    } finally {
      uploadBtn.textContent = 'Upload Selected File';
      selectedFile = null;
      fileInput.value = '';
    }
  });

  function showToast(msg, isError = false) {
    toast.textContent = msg;
    toast.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => toast.classList.remove('show'), 4000);
  }

  function addDocItem(name, chunks) {
    const item = document.createElement('div');
    item.className = 'doc-item';
    item.innerHTML = `<span class="doc-icon">📑</span><span class="doc-name" title="${name}">${name}</span><span class="doc-chunks">${chunks} chunks</span>`;
    docList.prepend(item);
  }

  // ─── Chat ─────────────────────────────────────────────────
  const messagesEl = document.getElementById('messages');
  const emptyState = document.getElementById('empty-state');
  const input = document.getElementById('question-input');
  const sendBtn = document.getElementById('send-btn');

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    sendBtn.disabled = !input.value.trim();
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
  });

  sendBtn.addEventListener('click', sendQuestion);
  sendBtn.disabled = true;

  async function sendQuestion() {
    const q = input.value.trim();
    if (!q) return;

    emptyState.style.display = 'none';
    input.value = '';
    input.style.height = '24px';
    sendBtn.disabled = true;

    appendMessage('user', q);

    const thinkingMsg = appendThinking();

    try {
      const res = await fetch(`${API}/ask`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q })
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      thinkingMsg.remove();
      appendMessage('assistant', data.answer);
    } catch (err) {
      thinkingMsg.remove();
      appendMessage('assistant', `⚠️ Error: ${err.message}`);
    }

    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function appendMessage(role, text) {
    const msg = document.createElement('div');
    msg.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '👤' : '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = formatText(text);

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return msg;
  }

  function appendThinking() {
    const msg = document.createElement('div');
    msg.className = 'message assistant';
    msg.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble">
        <div class="thinking"><span></span><span></span><span></span></div>
      </div>`;
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return msg;
  }

  function formatText(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br/>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/`(.*?)`/g, '<code style="background:#0f1117;padding:2px 6px;border-radius:4px;font-size:13px">$1</code>');
  }
</script>
</body>
</html>
